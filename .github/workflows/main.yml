name: Daily Fitness Bot

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC каждый день
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call bot daily job
        run: |
          curl -X POST "https://example-5lxmwj5pha-ey.a.run.app/jobs/daily?secret=${{ secrets.CRON_SECRET }}"
